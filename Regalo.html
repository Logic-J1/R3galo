<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Corazón 3D</title>
<meta name="color-scheme" content="dark">
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#090308;color:#fff;font-family:Arial,sans-serif
}
canvas{
  display:block;width:100%;height:100%;touch-action:none
}

/* Contador arriba, sin la etiqueta V5 */
.counter{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 15px;
  border-radius:20px;
  background:rgba(8,3,8,.66);
  border:1px solid rgba(255,160,210,.20);
  color:#f7dbe9;
  font-size:13px;
  pointer-events:none;
  z-index:5;
}

/* Pequeño texto inferior */
.tapmsg{
  position:fixed;
  left:50%;
  bottom:54px;
  transform:translateX(-50%);
  color:#a9879a;
  font-size:10px;
  opacity:.72;
  pointer-events:none;
  white-space:nowrap;
}

/* Aviso breve junto a la parte baja del corazón */
.status{
  position:fixed;
  left:50%;
  bottom:92px;
  transform:translateX(-50%);
  color:#bd8fa8;
  font-size:11px;
  opacity:.86;
  pointer-events:none;
  white-space:nowrap;
}

/* Frase */
.phrase{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.94);
  width:min(82vw,390px);
  padding:20px 22px;
  border-radius:18px;
  background:rgba(18,5,15,.88);
  border:1px solid rgba(255,170,215,.32);
  box-shadow:0 0 40px rgba(255,30,145,.18);
  text-align:center;
  color:#ffe9f4;
  font-family:Georgia,serif;
  font-size:20px;
  line-height:1.42;
  opacity:0;
  pointer-events:none;
  transition:opacity .45s ease,transform .45s ease;
  z-index:10;
}
.phrase.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1)
}
.found{
  margin-top:10px;
  font:11px Arial,sans-serif;
  color:#d99ab9
}

/* Resplandores pequeños, integrados con las partículas */
.marker{
  position:fixed;
  width:22px;height:22px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:4;
}
.marker:before{
  content:"";
  position:absolute;
  left:50%;top:50%;
  width:7px;height:7px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:rgba(255,235,248,1);
  box-shadow:
    0 0 5px rgba(255,255,255,1),
    0 0 11px rgba(255,105,180,1),
    0 0 22px rgba(255,45,160,.92),
    0 0 34px rgba(255,45,160,.50);
  animation:corePulse 1.45s ease-in-out infinite
}
.marker:after{
  content:"";
  position:absolute;
  inset:1px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(255,170,220,.30) 0%,
    rgba(255,70,170,.14) 30%,
    rgba(255,40,155,.045) 58%,
    transparent 76%);
  box-shadow:0 0 22px rgba(255,55,165,.60);
  animation:glowPulse 1.45s ease-in-out infinite
}

/* Color especial después del primer toque */
.marker.armed:before{
  background:rgba(225,255,252,1);
  box-shadow:
    0 0 5px rgba(255,255,255,1),
    0 0 12px rgba(72,255,218,1),
    0 0 24px rgba(35,235,195,.95),
    0 0 37px rgba(35,235,195,.55)
}
.marker.armed:after{
  background:radial-gradient(circle,
    rgba(105,255,225,.32) 0%,
    rgba(40,235,190,.15) 30%,
    rgba(25,220,180,.05) 58%,
    transparent 76%);
  box-shadow:0 0 22px rgba(35,235,195,.65)
}

@keyframes corePulse{
  0%,100%{transform:translate(-50%,-50%) scale(.82);opacity:.82}
  50%{transform:translate(-50%,-50%) scale(1.12);opacity:1}
}
@keyframes glowPulse{
  0%,100%{transform:scale(.72);opacity:.52}
  50%{transform:scale(1.10);opacity:.95}
}

/* Botón que solo aparece al completar las 10 */
.finalBtn{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%) translateY(12px);
  padding:10px 18px;
  border-radius:22px;
  border:1px solid rgba(255,165,215,.42);
  background:rgba(25,6,20,.86);
  color:#ffd9eb;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:opacity .45s ease,transform .45s ease,box-shadow .3s ease;
  box-shadow:0 0 18px rgba(255,45,160,.12);
  z-index:8;
}
.finalBtn.visible{
  opacity:1;
  pointer-events:auto;
  transform:translateX(-50%) translateY(0)
}
.finalBtn:active{
  box-shadow:0 0 28px rgba(255,60,170,.35)
}
</style>
</head>

<body>
<canvas id="c"></canvas>

<div class="counter" id="counter">♡ 0/10 frases descubiertas</div>
<div class="status" id="status">Busca los pequeños resplandores</div>
<div class="tapmsg" id="tapmsg">Arrastra para girar · pellizca para acercar</div>

<div class="phrase" id="phrase"></div>
<button class="finalBtn" id="finalBtn">♡ Ver última frase</button>

<div class="marker" id="m0"></div>
<div class="marker" id="m1"></div>
<div class="marker" id="m2"></div>
<div class="marker" id="m3"></div>
<div class="marker" id="m4"></div>
<div class="marker" id="m5"></div>
<div class="marker" id="m6"></div>
<div class="marker" id="m7"></div>
<div class="marker" id="m8"></div>
<div class="marker" id="m9"></div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});

if(!ctx){
  document.body.innerHTML='<div style="height:100vh;display:flex;align-items:center;justify-content:center;background:#090308;color:#f7dbe9;font-family:Arial;text-align:center;padding:30px">Tu navegador no pudo iniciar el lienzo del corazón.</div>';
  throw new Error("Canvas 2D no disponible");
}

let W=0,H=0,DPR=1;
let yaw=.15,pitch=-.08,zoom=1;
let targetYaw=yaw,targetPitch=pitch,targetZoom=zoom;
let dragging=false,lastX=0,lastY=0,lastDist=0;

function resize(){
  DPR=Math.min(devicePixelRatio||1,1.6);
  W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;
  canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);
resize();

/* ===== Corazón 3D V5 ===== */
const points=[];

function insideHeart(x,y){
  const X=x*1.05,Y=y;
  return Math.pow(X*X+Y*Y-1,3)-X*X*Math.pow(Y,3)<=0;
}

function makePoints(){
  const N=5600;
  let tries=0;
  while(points.length<N && tries<400000){
    tries++;
    const x=Math.random()*2.75-1.375;
    const y=Math.random()*2.55-1.35;
    if(!insideHeart(x,y))continue;

    let depth;
    if(y>.15){
      depth=.28+.20*(1-Math.min(1,Math.abs(y-.48)/.72));
    }else{
      depth=.48*(1-Math.min(.92,Math.max(0,(-y-.05)/1.25)));
      depth=Math.max(.10,depth);
    }

    if(y<-.35)
      depth*=Math.max(.18,1-(Math.abs(y+.35)/.9)*.72);

    const edge=Math.max(0,1-Math.pow(Math.abs(x)/1.38,2));
    depth*=Math.sqrt(edge);

    const z=(Math.random()*2-1)*depth;
    const surfaceBias=.72+.28*Math.random();

    points.push({
      x:x*1.03,
      y:y*.98,
      z:z*surfaceBias,
      s:.75+Math.random()*1.25,
      a:.42+Math.random()*.58
    });
  }
}
makePoints();

function rotate(p){
  const cy=Math.cos(yaw),sy=Math.sin(yaw);
  const cp=Math.cos(pitch),sp=Math.sin(pitch);

  let x=p.x*cy-p.z*sy;
  let z=p.x*sy+p.z*cy;
  let y=p.y*cp-z*sp;
  z=p.y*sp+z*cp;

  return{x,y,z};
}

function render(){
  yaw+=(targetYaw-yaw)*.13;
  pitch+=(targetPitch-pitch)*.13;
  zoom+=(targetZoom-zoom)*.13;

  ctx.fillStyle='#090308';
  ctx.fillRect(0,0,W,H);

  const cx=W/2,cy=H*.50;
  const g=ctx.createRadialGradient(cx,cy,15,cx,cy,Math.min(W,H)*.42);
  g.addColorStop(0,'rgba(255,55,145,.16)');
  g.addColorStop(.45,'rgba(190,20,105,.07)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  const arr=[];
  const scale=Math.min(W,H)*.30*zoom;

  for(const p of points){
    const q=rotate(p);
    const persp=1/(1-q.z*.17);
    arr.push({p,q,sc:persp});
  }
  arr.sort((a,b)=>a.q.z-b.q.z);

  for(const o of arr){
    const q=o.q,sc=o.sc;
    const sx=cx+q.x*scale*sc;
    const sy=cy-q.y*scale*sc;
    if(sx<-8||sx>W+8||sy<-8||sy>H+8)continue;

    const front=(q.z+.65)/1.3;
    const alpha=o.p.a*(.45+.55*Math.max(0,Math.min(1,front)));
    const size=o.p.s*(.70+.40*Math.max(0,front))*Math.min(1.25,zoom);

    ctx.fillStyle=`rgba(255,${115+Math.floor(80*front)},${185+Math.floor(55*front)},${alpha})`;
    ctx.beginPath();
    ctx.arc(sx,sy,size,0,Math.PI*2);
    ctx.fill();
  }

  requestAnimationFrame(render);
}
render();

/* ===== 10 frases y posiciones =====
   Las posiciones están en el espacio 3D, no en la pantalla.
*/
const secretPoints=[
 {x:-.63,y:.58,z:.34,text:"Entre tantas personas, tuve la suerte de encontrarte a ti."},
 {x:.66,y:.22,z:.25,text:"Me gusta la forma en que haces que un día cualquiera se sienta especial."},
 {x:.02,y:-.72,z:.08,text:"No necesito que todo sea perfecto, solo quiero seguir compartiendo el camino contigo."},
 {x:-.52,y:-.08,z:.38,text:"Contigo descubrí que los momentos pequeños también pueden convertirse en recuerdos enormes."},
 {x:.48,y:.58,z:-.08,text:"Hay lugares a los que quiero volver, pero siempre será mejor si tú estás conmigo."},
 {x:-.18,y:.12,z:-.34,text:"Si pudiera guardar momentos para siempre, elegiría muchos de los que he vivido contigo."},
 {x:.73,y:-.42,z:.10,text:"A veces no encuentro las palabras exactas, pero espero que puedas sentir todo lo que significas para mí."},
 {x:-.70,y:-.50,z:-.12,text:"Quiero seguir conociendo cada versión de ti, incluso las que todavía no conocemos."},
 {x:.20,y:-.35,z:.34,text:"Después de todo lo que hemos vivido, todavía me emociona pensar en todo lo que nos falta por vivir."},
 {x:.00,y:.76,z:.18,text:"Y si llegaste hasta aquí... hay algo que quiero que nunca olvides: te amo."}
];

const finalPhrase="Y ahora que encontraste cada parte de mi corazón, solo me queda decirte algo: quiero seguir llenándolo de momentos contigo. Te amo.";

const armed=new Set();
const discovered=new Set();
let phraseTimer=null;
let lastPointerDown={x:0,y:0,t:0};
let moved=false;

function projectPoint(p){
  const q=rotate(p);
  const persp=1/(1-q.z*.17);
  const scale=Math.min(W,H)*.30*zoom;
  return{
    x:W/2+q.x*scale*persp,
    y:H*.50-q.y*scale*persp,
    z:q.z,
    visible:q.z>-.22
  };
}

function updateMarkers(){
  for(let i=0;i<secretPoints.length;i++){
    const el=document.getElementById("m"+i);
    const p=projectPoint(secretPoints[i]);

    if(!p.visible){
      el.style.display="none";
      continue;
    }

    el.style.display="block";
    el.style.left=p.x+"px";
    el.style.top=p.y+"px";
    el.style.opacity=Math.max(.30,Math.min(1,(p.z+.22)/.8));
    el.classList.toggle("armed",armed.has(i));
  }
}

function showPhrase(i){
  const box=document.getElementById("phrase");
  box.innerHTML="“"+secretPoints[i].text+
    "”<div class='found'>Frase "+(i+1)+" de 10 ✦</div>";
  box.classList.add("show");

  clearTimeout(phraseTimer);
  phraseTimer=setTimeout(()=>{
    box.classList.remove("show");
  },4500);
}

function discover(i){
  if(!discovered.has(i)){
    discovered.add(i);
    document.getElementById("counter").textContent=
      `♡ ${discovered.size}/10 frases descubiertas`;
  }

  armed.add(i);
  document.getElementById("m"+i).classList.add("armed");

  showPhrase(i);

  if(discovered.size===10){
    document.getElementById("status").textContent="Has encontrado todos los resplandores ✦";
    document.getElementById("finalBtn").classList.add("visible");
  }else{
    document.getElementById("status").textContent=
      "Puedes volver a tocar los resplandores descubiertos";
  }
}

function checkTap(x,y){
  if(moved)return;

  for(let i=0;i<secretPoints.length;i++){
    const p=projectPoint(secretPoints[i]);
    if(!p.visible)continue;

    /* Área táctil algo mayor que el brillo visual */
    const d=Math.hypot(x-p.x,y-p.y);

    if(d<24){
      if(!armed.has(i)){
        armed.add(i);
        document.getElementById("m"+i).classList.add("armed");
        document.getElementById("status").textContent=
          "Lo encontraste ✦ Tócalo otra vez";
      }else{
        discover(i);
      }
      return;
    }
  }
}

/* Botón final */
document.getElementById("finalBtn").addEventListener("click",()=>{
  const box=document.getElementById("phrase");
  box.innerHTML="♡ "+finalPhrase+"<div class='found'>Última frase ✦</div>";
  box.classList.add("show");

  clearTimeout(phraseTimer);
  phraseTimer=setTimeout(()=>{
    box.classList.remove("show");
  },6500);
});

/* ===== Controles ===== */
function pointerDown(x,y){
  dragging=true;
  lastX=x;lastY=y;
}
function pointerMove(x,y){
  if(!dragging)return;
  const dx=x-lastX,dy=y-lastY;
  lastX=x;lastY=y;
  targetYaw+=dx*.009;
  targetPitch+=dy*.006;
  targetPitch=Math.max(-1.15,Math.min(1.15,targetPitch));
}
function pointerUp(){dragging=false}

canvas.addEventListener("pointerdown",e=>{
  canvas.setPointerCapture(e.pointerId);
  lastPointerDown={x:e.clientX,y:e.clientY,t:performance.now()};
  moved=false;
  pointerDown(e.clientX,e.clientY);
});

canvas.addEventListener("pointermove",e=>{
  if(Math.hypot(e.clientX-lastPointerDown.x,e.clientY-lastPointerDown.y)>9)moved=true;
  pointerMove(e.clientX,e.clientY);
});

canvas.addEventListener("pointerup",e=>{
  pointerUp();
  if(performance.now()-lastPointerDown.t<450)checkTap(e.clientX,e.clientY);
});
canvas.addEventListener("pointercancel",pointerUp);

canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  targetZoom*=Math.exp(-e.deltaY*.001);
  targetZoom=Math.max(.55,Math.min(1.65,targetZoom));
},{passive:false});

canvas.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    dragging=false;
    lastDist=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
  }
},{passive:false});

canvas.addEventListener("touchmove",e=>{
  if(e.touches.length===2){
    e.preventDefault();
    const d=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    if(lastDist){
      targetZoom*=d/lastDist;
      targetZoom=Math.max(.55,Math.min(1.65,targetZoom));
    }
    lastDist=d;
  }
},{passive:false});

canvas.addEventListener("touchend",()=>lastDist=0);

function markerLoop(){
  updateMarkers();
  requestAnimationFrame(markerLoop);
}
markerLoop();
</script>
</body>
</html>
